[project]
name = "mt5-mcp"
version = "0.1.0"
description = "MCP server exposing MetaTrader 5 (macOS, via a Wine-hosted bridge) to AI clients"
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.3.0,<3"]

[project.urls]
Homepage = "https://codewithbehnam.github.io/meta-trader-5-mcp/"
Repository = "https://github.com/CodeWithBehnam/meta-trader-5-mcp"

[project.scripts]
mt5-mcp = "mt5_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "ty"]

# The bridge is a separate uv project that runs inside Wine; it is deliberately
# not a workspace member and is excluded from every tool below.
[tool.ruff]
line-length = 100
extend-exclude = ["bridge", ".design-options"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
exclude = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["bridge"]
